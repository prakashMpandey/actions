name: secrets and production

on:
  workflow_dispatch:


jobs:
  staging-env:
    runs-on: ubuntu-24.04
    environment: staging

    env:
       API_KEY: ${{secrets.API_KEY}}
       NAME: ${{vars.NAME}}

    steps:
      - name: inspect value inside jobs
        run: |
          echo "staging api key secret : $API_KEY"
          echo "staging NAME : $NAME"
          echo "repository secret: ${{secrets.REPO_SECRET}}"
          echo "repository var: ${{vars.REPO_VAR}}}"
  
  production-env:
    runs-on: ubuntu-24.04
    environment: production
    env:
      API_KEY: ${{secrets.API_KEY}}
      NAME: ${{vars.NAME}}
    
    steps:
      - name: inspect value inside production job
        run: |
          echo "production api key secret: $API_KEY"
          echo "production name: $NAME"
          echo "repository secret: ${{secrets.REPO_SECRET}}"
          echo "repository var: ${{vars.REPO_VAR}}}"

      

      




