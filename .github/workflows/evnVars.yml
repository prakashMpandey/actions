name: env variables

on:
  workflow_dispatch:
env:
  WORKFLOW_VAR: I_AM_WORKFLOW_SCOPED
    
jobs:
  job-1:
    runs-on: ubuntu-24.04
    env:
      JOB_VAR: I_AM_JOB_SCOPED
    steps:
      - name: inspect scopes job 1 step 1
        env:
          STEP_VAR: I_AM_STEP_VAR
        run: |
          echo "workflow var : $WORKFLOW_VAR"
          echo "job var : $JOB_VAR"
          echo "step var : ${STEP_VAR:-<UNSET>}"
  
  
  job-2:
    runs-on: ubuntu-24.04
   
    steps:
      - name: inspect scopes job 1 step 1
        run: |
          echo "workflow var : $WORKFLOW_VAR"
          echo "job var : $JOB_VAR"
          echo "step var : ${STEP_VAR:-<UNSET>}"
  


    